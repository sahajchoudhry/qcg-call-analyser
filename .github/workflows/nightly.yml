name: QCG Nightly Call Processing

on:
  schedule:
    - cron: '0 22 * * *'  # 11pm UK time (BST)
  workflow_dispatch:

jobs:
  process-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore processed calls cache
        uses: actions/cache@v4
        with:
          path: processed_calls.txt
          key: processed-calls-${{ github.run_id }}
          restore-keys: |
            processed-calls-

      - name: Run nightly pipeline
        env:
          EIGHT_BY_EIGHT_KEY:    ${{ secrets.EIGHT_BY_EIGHT_KEY }}
          EIGHT_BY_EIGHT_SECRET: ${{ secrets.EIGHT_BY_EIGHT_SECRET }}
          EIGHT_BY_EIGHT_PBX_ID: ${{ secrets.EIGHT_BY_EIGHT_PBX_ID }}
          EIGHT_BY_EIGHT_REGION: ${{ secrets.EIGHT_BY_EIGHT_REGION }}
          OPENAI_KEY:            ${{ secrets.OPENAI_KEY }}
          SHEETS_URL:            ${{ secrets.SHEETS_URL }}
        run: python pipeline.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: '*.log'
          retention-days: 7
