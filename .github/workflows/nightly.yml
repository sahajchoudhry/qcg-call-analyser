name: QCG Nightly Call Processing

on:
  schedule:
    # 11pm UK time (23:00 BST = 22:00 UTC in summer, 23:00 UTC in winter)
    # Using 22:00 UTC to cover BST (adjust to 23:00 in winter if needed)
    - cron: '0 22 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  process-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run nightly pipeline
        env:
          EIGHT_BY_EIGHT_KEY:    ${{ secrets.EIGHT_BY_EIGHT_KEY }}
          EIGHT_BY_EIGHT_SECRET: ${{ secrets.EIGHT_BY_EIGHT_SECRET }}
          EIGHT_BY_EIGHT_PBX_ID: ${{ secrets.EIGHT_BY_EIGHT_PBX_ID }}
          OPENAI_KEY:            ${{ secrets.OPENAI_KEY }}
          SHEETS_URL:            ${{ secrets.SHEETS_URL }}
        run: python pipeline.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: '*.log'
          retention-days: 7
